{% extends "base.html" %}{% block title %}Add Medicine{% endblock %}{% block content %}<h1>Register medicine</h1><p class="text-secondary">Use fictional data for your project demo.</p><div class="card p-4"><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Medicine name *</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">Manufacturer *</label><input class="form-control" name="manufacturer" required></div><div class="col-md-6"><label class="form-label">Unique batch number *</label><input class="form-control" name="batch_no" required></div>
<div class="col-md-6"><label class="form-label">Barcode value (optional)</label><div class="input-group"><input class="form-control" name="barcode" id="barcode" placeholder="Scan or enter barcode"><button type="button" class="btn btn-outline-primary" onclick="startAdminScanner()">Scan</button></div></div>
<div class="col-12"><div id="admin-reader" class="scanner-box"></div><small class="text-secondary">Scanning fills the barcode only. Confirm medicine details and dates from the package before saving.</small></div><div class="col-md-6"><label class="form-label">Manufacturing date *</label><input class="form-control" type="date" name="mfg_date" required></div><div class="col-md-6"><label class="form-label">Expiry date *</label><input class="form-control" type="date" name="expiry_date" required></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description"></textarea></div></div><button class="btn btn-primary mt-4">Register</button></form></div>{% endblock %}
